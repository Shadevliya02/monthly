<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Paid Monthly Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 16:9 KPI wall. Dark sidebar left; right = one-screen tile grid (big numbers, few words).
   Full invoice table lives on its own page under "Invoice data". Light theme first, dark optional. */
:root {
  color-scheme: light;
  --bg: #f4f2f1;
  --surface: #ffffff;
  --surface-2: #f8f6f5;
  --ink: #1d1718;
  --ink-2: #5b5052;
  --ink-3: #8a7f81;
  --line: #e8e2e1;
  --accent: #b3141c;
  --accent-ink: #ffffff;
  --accent-soft: #fbeced;
  --side: #221a1b;
  --side-ink: #ece5e5;
  --side-ink-2: #a3989a;
  --side-hover: #2f2526;
  --side-active: #b3141c;
  --out: #2a78d6;      /* Outbound */
  --in: #1baf7a;       /* Inbound · Project Delta */
  --bar: #55606f;
  --good: #1f7a3a;  --good-soft: #e5f2e9;
  --warn: #9a5a00;  --warn-soft: #fdf1df;
  --bad: #c0262d;   --bad-soft: #fde8e8;
  --shadow: 0 1px 2px rgba(34,26,27,.05), 0 6px 18px rgba(34,26,27,.04);
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
:root.dark {
  color-scheme: dark;
  --bg: #121018; --surface: #1d1a26; --surface-2: #242030; --ink: #f2eff6; --ink-2: #c3bdcb; --ink-3: #8f889a;
  --line: #322d3d; --accent: #e2474e; --accent-ink: #1a0f10; --accent-soft: #3a1e24;
  --side: #0c0a11; --side-ink: #ece8f2; --side-ink-2: #9690a2; --side-hover: #1b1823; --side-active: #b3141c;
  --out: #3987e5; --in: #199e70; --bar: #8d99aa;
  --good: #4cc07a; --good-soft: #17301f; --warn: #f0b04a; --warn-soft: #3a2a12; --bad: #ff6b6b; --bad-soft: #3d1a1e;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
.side {
  background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
  padding-block: 22px 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 18px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 6px; }
.brand-mark { width: 36px; height: 36px; border-radius: 9px; background: var(--side-active); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 20px; height: 20px; }
.brand b { display: block; font: 800 16px/1.15 var(--f-display); }
.brand span { display: block; font-size: 11.5px; color: var(--side-ink-2); margin-top: 2px; }
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--side-ink-2); padding: 14px 10px 6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border: 0; border-radius: 8px;
  background: transparent; color: var(--side-ink); font-weight: 500; font-size: 13.5px; text-align: left; cursor: pointer; white-space: nowrap;
}
.nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.nav button:hover { background: var(--side-hover); }
.nav button.active { background: var(--side-active); color: #fff; font-weight: 600; }
.nav .sub button { padding-left: 42px; font-size: 13px; }
.nav button .count { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.1); }
.nav button.active .count { background: rgba(255,255,255,.22); }
.side-foot { margin-top: auto; padding: 14px 10px 0; font-size: 11.5px; color: var(--side-ink-2); border-top: 1px solid rgba(255,255,255,.08); }

.main { overflow-y: auto; min-width: 0; }
.page {
  display: flex; flex-direction: column; gap: 16px; min-height: 100%;
  padding-block: 20px 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}

/* ---------- Header ---------- */
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { font: 800 24px/1.15 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.head .sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.head .sub b { color: var(--ink); font-weight: 600; }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 100%; }
.periods { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; overflow-x: auto; max-width: 100%; }
.periods button { border: 0; background: transparent; height: 32px; min-width: 42px; padding: 0 9px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.periods button:hover { background: var(--surface-2); color: var(--ink); }
.periods button.empty { color: var(--ink-3); font-weight: 500; }
.periods button.year { font-weight: 800; color: var(--ink); margin-right: 4px; }
.periods button.on { background: var(--accent); color: var(--accent-ink); }
.ghost-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 12px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 12.5px; white-space: nowrap;
}
.ghost-btn:hover { background: var(--surface-2); }
.ghost-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- KPI grid ---------- */
#v-dash { height: 100%; min-height: 720px; }
.grid {
  flex: 1; display: grid; gap: 14px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr)); min-height: 0;
  grid-template-areas: "total trend trend open" "days speed returns partners" "waiting waiting waiting partners";
}
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.tile-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.tile-h h2 { margin: 0; font: 700 15px/1.25 var(--f-display); }
.tile-h .hint { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.big { font: 800 44px/1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big small { font-size: .45em; font-weight: 700; letter-spacing: 0; margin-left: 4px; color: var(--ink-2); }
.big-sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.big-sub b { color: var(--ink); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; }
.link:hover { text-decoration: underline; }
.empty-note { color: var(--ink-3); font-size: 13px; margin: auto 0; }

/* split rows (Outbound / Inbound) */
.split { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.split-row .lbl { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; }
.split-row .lbl span { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.split-row .lbl i { width: 10px; height: 10px; border-radius: 3px; }
.split-row .lbl b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.split-row .lbl em { font-style: normal; color: var(--ink-3); font-size: 12px; margin-left: 6px; font-weight: 500; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 3px; }

/* two big numbers side by side */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: auto 0; }
.duo > div + div { border-left: 1px solid var(--line); padding-left: 14px; }
.duo .k { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.duo .k i { width: 10px; height: 10px; border-radius: 3px; }
.duo .big { font-size: 40px; }
.duo .n { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

/* bars list */
.bars { display: flex; flex-direction: column; gap: 9px; margin-top: auto; margin-bottom: auto; }
.bars .row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 52px; align-items: center; gap: 10px; font-size: 12.5px; }
.bars .row .l b { display: block; font-weight: 700; white-space: nowrap; }
.bars .row .l span { display: block; font-size: 11px; color: var(--ink-3); }
.bars .row .track { height: 12px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bars .row .track span { display: block; height: 100%; border-radius: 4px; background: var(--bar); }
.bars .row .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.bars .row .v em { font-style: normal; display: block; font-size: 11px; color: var(--ink-3); font-weight: 500; }

/* partner list */
.plist { display: flex; flex-direction: column; gap: 2px; overflow: auto; margin: 0 -6px; }
.plist button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 6px 8px; cursor: pointer; }
.plist button:hover { background: var(--surface-2); }
.plist .top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.plist .top span { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.plist .top b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.plist .meta { font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; }
.plist .meter { height: 5px; margin-top: 4px; }

/* open tile */
.tile.alert { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.alert-dot { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; font: 800 15px/1 var(--f-display); }
.status-rows { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.status-rows button { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; }
.status-rows button:hover { background: var(--surface-2); }
.status-rows .cnt { font: 800 18px var(--f-display); font-variant-numeric: tabular-nums; }
.status-rows .val { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap; width: max-content; }
.chip svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.chip.paid { background: var(--good-soft); color: var(--good); }
.chip.review { background: var(--warn-soft); color: var(--warn); }
.chip.returned { background: var(--bad-soft); color: var(--bad); }

/* trend chart */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 6px; font-weight: 600; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.chart { flex: 1; min-height: 120px; position: relative; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--f-body); }

/* waiting list */
.wlist { display: flex; flex-direction: column; overflow: auto; margin: 0 -6px; }
.wlist button { display: grid; grid-template-columns: 92px minmax(0, 1fr) 130px 84px; gap: 14px; align-items: center; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 8px 6px; text-align: left; cursor: pointer; }
.wlist button:first-child { border-top: 0; }
.wlist button:hover { background: var(--surface-2); }
.wlist .who b { display: block; font-weight: 700; font-size: 13px; }
.wlist .who span { display: block; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.wlist .amt { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.wlist .age { text-align: right; }
.wlist .age b { display: block; font: 800 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.wlist .age span { font-size: 11px; color: var(--ink-3); }

/* return history */
.rstats { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.rstats div { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: baseline; }
.rstats b { font: 800 22px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right; }
.rstats span { font-size: 12.5px; color: var(--ink-2); }
.foot-note { font-size: 11.5px; color: var(--ink-3); }

/* ---------- Table page ---------- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; min-width: 0; }
.filters select, .filters input { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; font-size: 13px; font-weight: 500; min-width: 0; max-width: 100%; }
.filters .q input { width: 260px; max-width: 100%; }
.filters select { min-width: 150px; max-width: 240px; }
.filters .grow { flex: 1; }
.summary { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.summary b { font: 800 20px var(--f-display); color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }
.pill-x { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
thead th { text-align: left; font-size: 11px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th.sort { cursor: pointer; }
thead th.sort:hover { color: var(--ink); }
thead th .dir { color: var(--accent); margin-left: 3px; }
tbody td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
td.nw { white-space: nowrap; }
td.mono { font-family: var(--f-mono); font-size: 11px; }
td.desc { min-width: 240px; max-width: 360px; }
td.partner { min-width: 140px; max-width: 200px; font-weight: 600; }
td .muted, .muted { color: var(--ink-3); }
td .dl { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.pager .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.pager button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; font-weight: 600; }
.pager button[disabled] { opacity: .4; cursor: default; }
.pager button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- Tooltip & drawer ---------- */
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.45; max-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.scrim { position: fixed; inset: 0; background: rgba(18,14,16,.35); z-index: 30; }
.drawer {
  position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100%; background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.12); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.dr-h { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.dr-h .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.dr-h h3 { margin: 4px 0 8px; font: 700 16px/1.35 var(--f-display); }
.dr-x { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; flex: none; display: grid; place-items: center; }
.dr-x svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
.dr-b { padding: 18px 22px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.facts div span { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; }
.facts div b { font-weight: 600; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 0 12px; }
.steps .dot { width: 14px; height: 14px; border-radius: 50%; margin: 3px 4px 0; background: var(--surface); border: 2px solid var(--ink-3); }
.steps .lbl { font-weight: 600; }
.steps .dt { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); }
.steps .link-row { grid-column: 1 / -1; display: grid; grid-template-columns: 22px 1fr; gap: 12px; }
.steps .link-row .bar { width: 4px; margin: 2px auto; border-radius: 2px; min-height: 24px; }
.steps .link-row .txt { font-size: 12px; color: var(--ink-2); align-self: center; padding: 5px 0; }
.steps .link-row .txt b { color: var(--ink); }

/* one-screen layout only where the 16:9 wall has room; otherwise tiles take their natural height and the page scrolls */
@media (max-width: 1600px), (max-height: 1000px) {
  #v-dash { height: auto; }
  .grid { grid-template-rows: none; grid-auto-rows: minmax(260px, auto); }
  .tile.trend-t { min-height: 320px; }
}
@media (max-width: 1400px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(250px, auto);
    grid-template-areas: "total open" "trend trend" "days speed" "returns partners" "waiting waiting"; }
  .tile.trend-t { min-height: 300px; }
}
@media (max-width: 960px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .side { padding-block: 12px 10px; padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .brand { border: 0; padding-bottom: 4px; margin: 0; }
  .nav-label, .side-foot { display: none; }
  .nav-scroll { display: flex; overflow-x: auto; gap: 2px; }
  .nav { flex-direction: row; }
  .nav button, .nav .sub button { width: auto; padding-left: 12px; }
  .main { overflow: visible; }
  .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .head > div { min-width: 0; }
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "total" "open" "trend" "days" "speed" "returns" "partners" "waiting"; }
  .wlist button { grid-template-columns: minmax(0, 1fr) 70px; }
  .wlist .st, .wlist .amt { display: none; }
  .filters .q input, .filters select { width: 100%; max-width: 100%; }
  .filters label { flex: 1 1 140px; }
}
@media (prefers-reduced-motion: no-preference) { .drawer { transition: transform .2s ease; } }
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="app">
  <aside class="side" aria-label="Navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 18V9M12 18V5M18 18v-6"/></svg></div>
      <div><b>Paid Monitor</b><span>Outbound &amp; Inbound invoices</span></div>
    </div>
    <div class="nav-scroll">
      <div class="nav-label">Overview</div>
      <nav class="nav">
        <button data-go="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>KPI Dashboard</button>
      </nav>
      <div class="nav-label">Invoice data</div>
      <nav class="nav">
        <button data-go="all"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>All invoices<span class="count" id="c-all"></span></button>
        <div class="sub nav">
          <button data-go="outbound">Outbound<span class="count" id="c-out"></span></button>
          <button data-go="inbound">Inbound · Project Delta<span class="count" id="c-in"></span></button>
          <button data-go="returned">Returned<span class="count" id="c-ret"></span></button>
          <button data-go="review">In review<span class="count" id="c-rev"></span></button>
        </div>
      </nav>
    </div>
    <div class="side-foot" id="source"></div>
  </aside>

  <main class="main" id="main">
    <!-- KPI dashboard -->
    <section class="page" id="v-dash">
      <header class="head">
        <div>
          <h1>Paid Monthly · Outbound &amp; Inbound</h1>
          <div class="sub" id="d-sub"></div>
        </div>
        <div class="tools">
          <div class="periods" id="periods" role="tablist" aria-label="Period"></div>
          <button class="ghost-btn theme-btn" type="button"></button>
        </div>
      </header>
      <div class="grid">
        <article class="tile" style="grid-area:total" id="t-total"></article>
        <article class="tile trend-t" style="grid-area:trend" id="t-trend"></article>
        <article class="tile" style="grid-area:open" id="t-open"></article>
        <article class="tile" style="grid-area:days" id="t-days"></article>
        <article class="tile" style="grid-area:speed" id="t-speed"></article>
        <article class="tile" style="grid-area:returns" id="t-returns"></article>
        <article class="tile" style="grid-area:partners" id="t-partners"></article>
        <article class="tile" style="grid-area:waiting" id="t-waiting"></article>
      </div>
    </section>

    <!-- Invoice table -->
    <section class="page" id="v-table" hidden>
      <header class="head">
        <div>
          <h1 id="tb-title">All invoices</h1>
          <div class="sub">Every order in the source file. Click a row to see its full timeline.</div>
        </div>
        <div class="tools"><button class="ghost-btn theme-btn" type="button"></button></div>
      </header>
      <div class="filters">
        <label class="q">Search<input id="f-q" type="search" placeholder="Partner, description, invoice no."></label>
        <label>Type<select id="f-kind">
          <option value="all">All types</option>
          <option value="outbound">Outbound (all)</option>
          <option value="out-xc">Outbound · Cross Connect</option>
          <option value="out-colo">Outbound · Colocation</option>
          <option value="inbound">Inbound · Project Delta</option>
        </select></label>
        <label>Partner<select id="f-partner"></select></label>
        <label>Status<select id="f-status">
          <option value="all">All statuses</option>
          <option value="paid">Paid</option>
          <option value="review">In review</option>
          <option value="returned">Returned</option>
        </select></label>
        <label>Paid month<select id="f-month"></select></label>
        <span class="grow"></span>
        <button class="ghost-btn" type="button" id="f-reset">Reset filters</button>
      </div>
      <div class="summary" id="tb-sum"></div>
      <section class="card">
        <div class="tbl-wrap" id="tb"></div>
        <div class="pager" id="pager"></div>
      </section>
    </section>
  </main>
</div>

<div class="tip" id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Invoice details"></aside>

<script src="data.js"></script>
<script>
/* ===================================================================
   Data comes from data.js (built by tools/build_data.py from the xlsx).
   Inbound = Type of Work "Project Delta"; Outbound = "Outbound".
   =================================================================== */
const SRC = window.PAYMENT_DATA;
const YEAR = 2026;
const MS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const STATUS = { paid: "Paid", review: "In review", returned: "Returned" };
const ICON_ST = {
  paid: `<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>`,
  review: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>`,
  returned: `<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>`,
};

const D = s => new Date(s + "T00:00:00");
const NOW = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const TODAY = NOW.getFullYear() + "-" + String(NOW.getMonth() + 1).padStart(2, "0") + "-" + String(NOW.getDate()).padStart(2, "0");
const days = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const fmtD = s => { if (!s) return "—"; const d = D(s); return d.getDate() + " " + MS[d.getMonth()] + " " + d.getFullYear(); };
const rp = n => "Rp " + Math.round(n).toLocaleString("en-US");
const rpS = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return "Rp " + (n / 1e9).toFixed(a >= 1e11 ? 0 : a >= 1e10 ? 1 : 2) + "B";
  if (a >= 1e6) return "Rp " + (n / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "M";
  if (a >= 1e3) return "Rp " + (n / 1e3).toFixed(0) + "K";
  return rp(n);
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const avg = (a, f) => a.length ? sum(a, f) / a.length : 0;
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const $ = id => document.getElementById(id);
const chip = st => `<span class="chip ${st}">${ICON_ST[st] || ""}${STATUS[st] || esc(st)}</span>`;

const ORDERS = SRC.orders.map(o => ({
  ...o,
  seg: o.work === "Project Delta" ? "Inbound" : "Outbound",
  lead: o.paid ? days(o.submit, o.paid) : null,          // submit -> paid
  waiting: o.paid ? null : days(o.submit, TODAY),        // still open: days since submit
}));
const SEGS = [
  { k: "Outbound", label: "Outbound", col: "var(--out)" },
  { k: "Inbound", label: "Inbound · Project Delta", col: "var(--in)" },
];

/* ---------- state ---------- */
const state = {
  view: "dash", nav: "dash", period: "year", trendMode: "value", dark: false,
  f: { q: "", kind: "all", partner: "all", status: "all", month: "all", hist: false },
  sort: { key: "submit", dir: -1 }, page: 0,
};
try {
  const p = localStorage.getItem("pm2-period"); if (p !== null) state.period = p === "year" ? "year" : +p;
  state.dark = localStorage.getItem("pm2-theme") === "dark";
} catch (e) {}
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const inPeriod = o => {
  if (o.status !== "paid" || !o.paid) return false;
  const d = D(o.paid);
  return d.getFullYear() === YEAR && (state.period === "year" || d.getMonth() === state.period);
};
const periodName = () => state.period === "year" ? String(YEAR) : MONTHS[state.period] + " " + YEAR;

/* ---------- theme ---------- */
function applyTheme() {
  document.documentElement.classList.toggle("dark", state.dark);
  document.querySelectorAll(".theme-btn").forEach(b => {
    b.setAttribute("aria-pressed", state.dark);
    b.innerHTML = state.dark
      ? `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light mode`
      : `<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark mode`;
  });
}

/* =================== DASHBOARD =================== */
function renderPeriods() {
  const has = m => ORDERS.some(o => o.paid && D(o.paid).getFullYear() === YEAR && D(o.paid).getMonth() === m);
  $("periods").innerHTML =
    `<button class="year${state.period === "year" ? " on" : ""}" data-period="year" role="tab" aria-selected="${state.period === "year"}" data-tip="Whole year ${YEAR}">${YEAR}</button>` +
    MS.map((m, i) => `<button class="${state.period === i ? "on" : ""}${has(i) ? "" : " empty"}" data-period="${i}" role="tab" aria-selected="${state.period === i}" data-tip="${MONTHS[i]} ${YEAR}${has(i) ? "" : " · no paid invoices"}">${m}</button>`).join("");
}

function tileTotal(paid) {
  const tot = sum(paid, o => o.value);
  const rows = SEGS.map(s => { const g = paid.filter(o => o.seg === s.k); return { ...s, n: g.length, v: sum(g, o => o.value) }; });
  $("t-total").innerHTML = `
    <div class="tile-h"><h2>Total paid</h2><span class="hint">${periodName()}</span></div>
    <div><div class="big">${rpS(tot)}</div><div class="big-sub"><b>${paid.length}</b> ${paid.length === 1 ? "invoice" : "invoices"} paid</div></div>
    <div class="split">${rows.map(r => `
      <div class="split-row" data-tip="${esc(`<b>${r.label}</b><br>${rp(r.v)}<br>${r.n} invoices · ${pct(r.v, tot)}% of value`)}">
        <div class="lbl"><span><i style="background:${r.col}"></i>${r.label}</span><b>${rpS(r.v)}<em>${r.n} inv.</em></b></div>
        <div class="meter"><span style="width:${tot ? r.v / tot * 100 : 0}%;background:${r.col}"></span></div>
      </div>`).join("")}</div>`;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function tileTrend() {
  const mode = state.trendMode;
  const data = MS.map((_, m) => {
    const g = ORDERS.filter(o => o.status === "paid" && o.paid && D(o.paid).getFullYear() === YEAR && D(o.paid).getMonth() === m);
    const by = SEGS.map(s => { const x = g.filter(o => o.seg === s.k); return { n: x.length, v: sum(x, o => o.value) }; });
    return { m, by, n: g.length, v: sum(g, o => o.value) };
  });
  const val = (d, i) => mode === "value" ? d.by[i].v : d.by[i].n;
  const tot = d => mode === "value" ? d.v : d.n;
  const max = niceMax(Math.max(...data.map(tot)));
  const W = 760, H = 250, L = 56, R = 8, T = 22, B = 26;
  const bw = (W - L - R) / 12, x = m => L + m * bw, y = v => T + (1 - v / max) * (H - T - B);
  const fmt = v => mode === "value" ? rpS(v).replace("Rp ", "") : String(v);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Paid per month">`;
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4;
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  data.forEach(d => {
    const dim = state.period !== "year" && state.period !== d.m;
    const cx = x(d.m) + bw * .2, w = bw * .6;
    const parts = SEGS.map((sg, i) => ({ sg, v: val(d, i) })).filter(p => p.v > 0);
    let acc = 0;
    parts.forEach((p, j) => {
      const gap = j > 0 ? 2 : 0;
      const yTop = y(acc + p.v), yBot = y(acc) - gap;
      const h = Math.max(1.5, yBot - yTop);
      const isTop = j === parts.length - 1;
      // rounded top on the last segment only: draw rect + square-off the bottom corners
      s += `<rect x="${cx}" y="${yBot - h}" width="${w}" height="${h}" rx="${isTop ? 4 : 0}" fill="${p.sg.col}" opacity="${dim ? .28 : 1}"/>`;
      if (isTop && h > 4) s += `<rect x="${cx}" y="${yBot - 4}" width="${w}" height="4" fill="${p.sg.col}" opacity="${dim ? .28 : 1}"/>`;
      acc += p.v;
    });
    if (tot(d)) s += `<text x="${cx + w / 2}" y="${y(tot(d)) - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" opacity="${dim ? .4 : 1}">${fmt(tot(d))}</text>`;
    s += `<text x="${cx + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11.5" font-weight="${state.period === d.m ? 800 : 500}" fill="${state.period === d.m ? "var(--ink)" : "var(--ink-2)"}">${MS[d.m]}</text>`;
    const tip = `<b>${MONTHS[d.m]} ${YEAR}</b><br>` + (d.n ? SEGS.map((sg, i) => `${sg.label}: ${rpS(d.by[i].v)} · ${d.by[i].n} inv.`).join("<br>") + `<br>Total: ${rp(d.v)}` : "No invoices paid") + `<br><i>Click to view this month</i>`;
    s += `<rect x="${x(d.m)}" y="${T}" width="${bw}" height="${H - T}" fill="transparent" data-period="${d.m}" data-tip="${esc(tip)}" style="cursor:pointer"/>`;
  });
  s += "</svg>";
  $("t-trend").innerHTML = `
    <div class="tile-h"><h2>Paid per month</h2>
      <div class="legend">${SEGS.map(sg => `<span><i style="background:${sg.col}"></i>${sg.label}</span>`).join("")}
        <span class="seg"><button class="${mode === "value" ? "on" : ""}" data-trend="value">Value</button><button class="${mode === "count" ? "on" : ""}" data-trend="count">Invoices</button></span>
      </div>
    </div>
    <div class="chart">${s}</div>`;
}

function tileOpen() {
  const open = ORDERS.filter(o => o.status !== "paid");
  const ret = open.filter(o => o.status === "returned"), rev = open.filter(o => o.status === "review");
  const oldest = open.slice().sort((a, b) => b.waiting - a.waiting)[0];
  const t = $("t-open");
  t.classList.toggle("alert", ret.length > 0);
  t.innerHTML = `
    ${ret.length ? `<span class="alert-dot" data-tip="${ret.length} invoices were returned and need action">!</span>` : ""}
    <div class="tile-h"><h2>Not paid yet</h2><span class="hint" style="margin-right:${ret.length ? 34 : 0}px">As of ${fmtD(TODAY)}</span></div>
    <div><div class="big">${open.length}<small>invoices</small></div><div class="big-sub"><b>${rpS(sum(open, o => o.value))}</b> waiting to be paid</div></div>
    <div class="status-rows">
      <button data-go="returned">${chip("returned")}<span class="val">${rpS(sum(ret, o => o.value))}</span><span class="cnt">${ret.length}</span></button>
      <button data-go="review">${chip("review")}<span class="val">${rpS(sum(rev, o => o.value))}</span><span class="cnt">${rev.length}</span></button>
    </div>
    ${oldest ? `<div class="foot-note">Oldest: <b>${oldest.waiting} days</b> since submit (${esc(oldest.partner)})</div>` : ""}`;
}

function tileDays(paid) {
  const cells = SEGS.map(s => { const g = paid.filter(o => o.seg === s.k); return { ...s, n: g.length, a: g.length ? Math.round(avg(g, o => o.lead)) : null }; });
  $("t-days").innerHTML = `
    <div class="tile-h"><h2>Average days to get paid</h2></div>
    <div class="foot-note" style="margin-top:-6px">From submit invoice date to paid date</div>
    <div class="duo">${cells.map(c => `
      <div><div class="k"><i style="background:${c.col}"></i>${c.k}</div>
        <div class="big">${c.a === null ? "–" : c.a}<small>${c.a === null ? "" : "days"}</small></div>
        <div class="n">${c.n ? plural(c.n, "invoice") + " paid" : "None paid"}</div></div>`).join("")}</div>`;
}

const BUCKETS = [
  { l: "≤ 30 days", s: "under 1 month", t: d => d <= 30 },
  { l: "31–90 days", s: "1–3 months", t: d => d > 30 && d <= 90 },
  { l: "91–180 days", s: "4–6 months", t: d => d > 90 && d <= 180 },
  { l: "181–365 days", s: "7–12 months", t: d => d > 180 && d <= 365 },
  { l: "> 365 days", s: "over 12 months", t: d => d > 365 },
];
function tileSpeed(paid) {
  const rows = BUCKETS.map(b => ({ ...b, n: paid.filter(o => b.t(o.lead)).length }));
  const max = Math.max(1, ...rows.map(r => r.n));
  $("t-speed").innerHTML = `
    <div class="tile-h"><h2>How fast invoices were paid</h2></div>
    ${paid.length ? `<div class="bars">${rows.map(r => `
      <div class="row" data-tip="${esc(`<b>${r.l}</b> (${r.s})<br>${r.n} invoices · ${pct(r.n, paid.length)}%`)}">
        <div class="l"><b>${r.l}</b><span>${r.s}</span></div>
        <div class="track"><span style="width:${r.n / max * 100}%"></span></div>
        <div class="v">${r.n}<em>${pct(r.n, paid.length)}%</em></div>
      </div>`).join("")}</div>` : `<p class="empty-note">No invoices paid in ${periodName()}.</p>`}`;
}

function tileReturns() {
  const withR = ORDERS.filter(o => o.cycles.length);
  const cycles = withR.flatMap(o => o.cycles);
  const fix = cycles.filter(c => c[1]).map(c => days(c[0], c[1]));
  const paidR = withR.filter(o => o.paid);
  const toPaid = paidR.map(o => { const c = o.cycles[o.cycles.length - 1]; return days(c[1] || c[0], o.paid); });
  $("t-returns").innerHTML = `
    <div class="tile-h"><h2>Return history</h2><button class="link" data-hist="1">See invoices →</button></div>
    <div><div class="big">${cycles.length}<small>returns</small></div><div class="big-sub">on <b>${withR.length}</b> outbound invoices with recorded dates</div></div>
    <div class="rstats">
      <div><b>${fix.length ? Math.round(avg(fix, x => x)) : "–"}</b><span>avg days for the partner to fix and resubmit</span></div>
      <div><b>${toPaid.length ? Math.round(avg(toPaid, x => x)) : "–"}</b><span>avg days from last resubmit to paid (${paidR.length} paid so far)</span></div>
    </div>
    <div class="foot-note">Return dates are recorded for these ${withR.length} invoices only.</div>`;
}

function tilePartners(paid) {
  const map = {};
  paid.forEach(o => { const m = map[o.partner] = map[o.partner] || { p: o.partner, v: 0, n: 0, seg: o.seg }; m.v += o.value; m.n++; });
  const list = Object.values(map).sort((a, b) => b.v - a.v);
  const top = list.slice(0, 8), max = top.length ? top[0].v : 1, tot = sum(list, x => x.v);
  $("t-partners").innerHTML = `
    <div class="tile-h"><h2>Top partners by paid value</h2><span class="hint">${list.length} partners</span></div>
    ${top.length ? `<div class="plist">${top.map(x => `
      <button data-partner="${esc(x.p)}" data-tip="${esc(`<b>${x.p}</b><br>${rp(x.v)} · ${pct(x.v, tot)}% of total<br>${x.n} invoices paid<br><i>Click to see the invoices</i>`)}">
        <div class="top"><span>${esc(x.p)}</span><b>${rpS(x.v)}</b></div>
        <div class="meter"><span style="width:${x.v / max * 100}%;background:${x.seg === "Inbound" ? "var(--in)" : "var(--out)"}"></span></div>
        <div class="meta"><span>${x.seg}</span><span>${x.n} inv. · ${pct(x.v, tot)}%</span></div>
      </button>`).join("")}</div>` : `<p class="empty-note">No invoices paid in ${periodName()}.</p>`}`;
}

function tileWaiting() {
  const open = ORDERS.filter(o => o.status !== "paid").sort((a, b) => b.waiting - a.waiting).slice(0, 4);
  $("t-waiting").innerHTML = `
    <div class="tile-h"><h2>Waiting longest for payment</h2><button class="link" data-go="open">See all unpaid →</button></div>
    <div class="wlist">${open.map(o => `
      <button data-id="${o.no}">
        <span class="st">${chip(o.status)}</span>
        <span class="who"><b>${esc(o.partner)}</b><span>${esc(o.desc)}</span></span>
        <span class="amt">${rp(o.value)}</span>
        <span class="age"><b>${o.waiting}</b><span>days waiting</span></span>
      </button>`).join("")}</div>`;
}

function renderDash() {
  const paid = ORDERS.filter(inPeriod);
  $("d-sub").innerHTML = `Invoices paid in <b>${periodName()}</b>${state.period === "year" ? " · pick a month to zoom in" : ` · <button class="link" data-period="year">Back to full year</button>`}`;
  renderPeriods(); tileTotal(paid); tileTrend(); tileOpen(); tileDays(paid); tileSpeed(paid); tileReturns(); tilePartners(paid); tileWaiting();
}

/* =================== TABLE =================== */
const PRESETS = {
  all: { title: "All invoices" },
  outbound: { title: "Outbound invoices", kind: "outbound" },
  inbound: { title: "Inbound invoices · Project Delta", kind: "inbound" },
  returned: { title: "Returned invoices", status: "returned" },
  review: { title: "Invoices in review", status: "review" },
  open: { title: "Unpaid invoices", month: "unpaid" },
};
function fillSelects() {
  const partners = [...new Set(ORDERS.map(o => o.partner))].sort((a, b) => a.localeCompare(b));
  $("f-partner").innerHTML = `<option value="all">All partners (${partners.length})</option>` + partners.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  $("f-month").innerHTML = `<option value="all">Any</option><option value="unpaid">Not paid yet</option>` + MONTHS.map((m, i) => `<option value="${i}">${m} ${YEAR}</option>`).join("");
}
function tableRows() {
  const f = state.f, q = f.q.trim().toLowerCase();
  let rows = ORDERS.filter(o =>
    (f.kind === "all" || (f.kind === "outbound" && o.seg === "Outbound") || (f.kind === "inbound" && o.seg === "Inbound") ||
      (f.kind === "out-xc" && o.project === "Cross Connect") || (f.kind === "out-colo" && o.project === "Colocation")) &&
    (f.partner === "all" || o.partner === f.partner) &&
    (f.status === "all" || o.status === f.status) &&
    (f.month === "all" || (f.month === "unpaid" ? !o.paid : (o.paid && D(o.paid).getFullYear() === YEAR && D(o.paid).getMonth() === +f.month))) &&
    (!f.hist || o.cycles.length) &&
    (!q || (o.partner + " " + o.desc + " " + o.inv + " " + o.contract).toLowerCase().includes(q)));
  const { key, dir } = state.sort;
  const get = { submit: o => o.submit, paid: o => o.paid || "", value: o => o.value, days: o => o.paid ? o.lead : o.waiting, no: o => o.no }[key];
  rows.sort((a, b) => { const x = get(a), y = get(b); return (x > y ? 1 : x < y ? -1 : a.no - b.no) * dir; });
  return rows;
}
function renderTable() {
  const f = state.f;
  $("f-q").value = f.q; $("f-kind").value = f.kind; $("f-partner").value = f.partner; $("f-status").value = f.status; $("f-month").value = String(f.month);
  $("tb-title").textContent = (PRESETS[state.nav] || PRESETS.all).title;
  const rows = tableRows();
  const paid = rows.filter(o => o.paid);
  $("tb-sum").innerHTML = `<span><b>${rows.length}</b>invoices</span><span><b>${rpS(sum(rows, o => o.value))}</b>total BAST value</span><span><b>${paid.length}</b>paid</span><span><b>${rows.length - paid.length}</b>not paid yet</span>` +
    (f.hist ? `<button class="pill-x" data-hist="0">With return dates only ✕</button>` : "");
  const PAGE = 20, pages = Math.max(1, Math.ceil(rows.length / PAGE));
  state.page = Math.min(state.page, pages - 1);
  const slice = rows.slice(state.page * PAGE, state.page * PAGE + PAGE);
  const th = (k, l, cls = "") => `<th class="sort ${cls}" data-sort="${k}">${l}${state.sort.key === k ? `<span class="dir">${state.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`;
  if (!rows.length) { $("tb").innerHTML = `<p class="empty-note" style="padding:40px 16px;text-align:center">No invoices match these filters.</p>`; $("pager").innerHTML = ""; return; }
  $("tb").innerHTML = `<table><thead><tr>
      ${th("no", "No")}<th>Type of Work</th><th>Type Project</th><th>Partner</th><th>Description</th><th>Invoice Number</th>
      ${th("value", "BAST Value", "r")}<th>Status</th>${th("submit", "Submit Date")}<th>Return Date</th><th>Resubmit Date</th>${th("paid", "Paid Date")}${th("days", "Days", "r")}
    </tr></thead><tbody>${slice.map(o => `
      <tr data-id="${o.no}" tabindex="0">
        <td class="muted num">${o.no}</td>
        <td class="nw">${o.seg}</td>
        <td class="nw">${o.project === "-" ? "Project Delta" : esc(o.project)}</td>
        <td class="partner">${esc(o.partner)}</td>
        <td class="desc">${esc(o.desc)}</td>
        <td class="mono">${esc(o.inv)}</td>
        <td class="r nw num">${rp(o.value)}</td>
        <td>${chip(o.status)}</td>
        <td class="nw num">${fmtD(o.submit)}</td>
        <td>${o.cycles.length ? `<div class="dl">${o.cycles.map(c => fmtD(c[0])).join("<br>")}</div>` : `<span class="muted">—</span>`}</td>
        <td>${o.cycles.length ? `<div class="dl">${o.cycles.map(c => c[1] ? fmtD(c[1]) : `<span class="muted">not recorded</span>`).join("<br>")}</div>` : `<span class="muted">—</span>`}</td>
        <td class="nw num">${o.paid ? fmtD(o.paid) : `<span class="muted">—</span>`}</td>
        <td class="r nw num">${o.paid ? `<b>${o.lead}</b> <span class="muted">to pay</span>` : `<b>${o.waiting}</b> <span class="muted">waiting</span>`}</td>
      </tr>`).join("")}</tbody></table>`;
  const btn = (p, l, on) => `<button data-page="${p}"${on ? ' class="on"' : ""}${p < 0 || p >= pages ? " disabled" : ""}>${l}</button>`;
  const nums = []; for (let p = Math.max(0, state.page - 2); p <= Math.min(pages - 1, state.page + 2); p++) nums.push(btn(p, p + 1, p === state.page));
  $("pager").innerHTML = `<span>Showing ${state.page * PAGE + 1}–${state.page * PAGE + slice.length} of ${rows.length}</span><div class="btns">${btn(state.page - 1, "‹ Prev")}${nums.join("")}${btn(state.page + 1, "Next ›")}</div>`;
}

/* =================== DRAWER =================== */
function openDrawer(o) {
  const ev = [{ l: "Submit invoice", d: o.submit, c: "var(--ink-2)" }];
  const multi = o.cycles.length > 1;
  o.cycles.forEach((c, i) => {
    const n = multi ? " #" + (i + 1) : "";
    ev.push({ l: "Returned" + n, d: c[0], c: "var(--bad)", fill: true, gap: "In review" });
    ev.push({ l: "Resubmitted" + n, d: c[1], c: "var(--warn)", gap: "Partner fixing documents" });
  });
  if (o.paid) ev.push({ l: "Paid", d: o.paid, c: "var(--good)", fill: true, gap: o.cycles.length ? "Final review to payment" : "Review to payment" });
  else ev.push({ l: "Today · not paid yet", d: TODAY, c: "var(--ink-3)", gap: "Waiting so far" });
  let steps = "", last = null;
  ev.forEach((e, i) => {
    if (i > 0) {
      const g = e.d && last ? days(last.d, e.d) : null;
      const col = e.gap === "Partner fixing documents" ? "var(--warn)" : e.l === "Paid" ? "var(--good)" : "var(--line)";
      steps += `<li class="link-row"><span class="bar" style="background:${col};min-height:${g === null ? 24 : Math.min(64, 22 + g / 3)}px"></span><span class="txt">${g === null ? "Date not recorded" : `<b>${g} days</b> · ${e.gap}`}</span></li>`;
    }
    steps += `<li><span class="dot" style="border-color:${e.c}${e.fill ? ";background:" + e.c : ""}"></span><span class="lbl">${e.l}</span><span class="dt">${e.d ? fmtD(e.d) : "not recorded"}</span></li>`;
    if (e.d) last = e;
  });
  $("drawer").innerHTML = `
    <div class="dr-h">
      <div><div class="eyebrow">${o.seg === "Inbound" ? "Inbound · Project Delta" : "Outbound · " + esc(o.project)}</div>
        <h3>${esc(o.desc)}</h3>${chip(o.status)}</div>
      <button class="dr-x" id="dr-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="dr-b">
      <div class="facts">
        <div class="wide"><span>Partner</span><b>${esc(o.partner)}</b></div>
        <div><span>BAST Value</span><b class="num">${rp(o.value)}</b></div>
        <div><span>${o.paid ? "Submit → Paid" : "Waiting since submit"}</span><b>${o.paid ? o.lead : o.waiting} days</b></div>
        <div><span>Invoice Number</span><b>${esc(o.inv)}</b></div>
        <div><span>Contract Number</span><b>${esc(o.contract)}</b></div>
      </div>
      <ol class="steps">${steps}</ol>
      ${o.cycles.length ? "" : `<p class="foot-note">No return dates recorded for this invoice.</p>`}
    </div>`;
  $("drawer").hidden = false; $("scrim").hidden = false; $("dr-x").focus();
}
function closeDrawer() { $("drawer").hidden = true; $("scrim").hidden = true; }

/* =================== NAV & EVENTS =================== */
function go(key, extra = {}) {
  if (key === "dash") { state.view = "dash"; state.nav = "dash"; }
  else {
    const p = PRESETS[key] || PRESETS.all;
    state.view = "table"; state.nav = key; state.page = 0;
    state.f = { q: "", kind: p.kind || "all", partner: "all", status: p.status || "all", month: p.month || "all", hist: false, ...extra };
  }
  closeDrawer(); render(); $("main").scrollTo({ top: 0 });
}
function render() {
  $("v-dash").hidden = state.view !== "dash";
  $("v-table").hidden = state.view !== "table";
  document.querySelectorAll(".nav button[data-go]").forEach(b => b.classList.toggle("active", b.dataset.go === state.nav));
  if (state.view === "dash") renderDash(); else renderTable();
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest(".theme-btn")) { state.dark = !state.dark; save("pm2-theme", state.dark ? "dark" : "light"); applyTheme(); return; }
  const per = t.closest("[data-period]");
  if (per) { state.period = per.dataset.period === "year" ? "year" : +per.dataset.period; save("pm2-period", state.period); state.view = "dash"; state.nav = "dash"; render(); return; }
  const tr = t.closest("[data-trend]");
  if (tr) { state.trendMode = tr.dataset.trend; tileTrend(); return; }
  const g = t.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const pa = t.closest("[data-partner]");
  if (pa) { go("all", { partner: pa.dataset.partner, status: "paid", month: state.period === "year" ? "all" : String(state.period) }); return; }
  const hi = t.closest("[data-hist]");
  if (hi) { if (hi.dataset.hist === "1") go("all", { hist: true }); else { state.f.hist = false; state.page = 0; renderTable(); } return; }
  const so = t.closest("[data-sort]");
  if (so) { const k = so.dataset.sort; state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === "no" ? 1 : -1 }; renderTable(); return; }
  const pg = t.closest("[data-page]");
  if (pg) { if (!pg.disabled) { state.page = +pg.dataset.page; renderTable(); } return; }
  const row = t.closest("[data-id]");
  if (row) { openDrawer(ORDERS.find(o => o.no === +row.dataset.id)); return; }
  if (t.closest("#f-reset")) { go(state.nav === "dash" ? "all" : state.nav); return; }
  if (t.closest("#dr-x") || t.id === "scrim") closeDrawer();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("drawer").hidden) closeDrawer();
  if (e.key === "Enter" && e.target.matches("tr[data-id]")) openDrawer(ORDERS.find(o => o.no === +e.target.dataset.id));
});
[["f-kind", "kind"], ["f-partner", "partner"], ["f-status", "status"], ["f-month", "month"]].forEach(([id, k]) =>
  $(id).addEventListener("change", e => { state.f[k] = e.target.value; state.page = 0; renderTable(); }));
$("f-q").addEventListener("input", e => { state.f.q = e.target.value; state.page = 0; renderTable(); });

const tip = $("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute("data-tip"); tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

/* counts in the sidebar */
$("c-all").textContent = ORDERS.length;
$("c-out").textContent = ORDERS.filter(o => o.seg === "Outbound").length;
$("c-in").textContent = ORDERS.filter(o => o.seg === "Inbound").length;
$("c-ret").textContent = ORDERS.filter(o => o.status === "returned").length;
$("c-rev").textContent = ORDERS.filter(o => o.status === "review").length;
$("source").innerHTML = `Source: ${esc(SRC.source)} · ${ORDERS.length} records`;

fillSelects(); applyTheme(); render();
</script>
<!--BODY-END-->
</body>
</html>
